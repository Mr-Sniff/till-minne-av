<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Remembered</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg1: #0a0d18;
      --bg2: #161c33;
      --glow: rgba(233, 196, 106, .10);
      --text: #f1e8d8;
      --muted: #a79f90;
      --accent: #e9c46a;
      --card: rgba(24, 30, 52, .88);
      --line: rgba(241, 232, 216, .16);
      --field: rgba(255, 255, 255, .06);
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme:light) {
      :root {
        --bg1: #f6f0e4;
        --bg2: #e6dcc8;
        --glow: rgba(180, 130, 40, .12);
        --text: #2b2620;
        --muted: #6f675a;
        --accent: #9a6b14;
        --card: rgba(255, 251, 242, .94);
        --line: rgba(43, 38, 32, .18);
        --field: rgba(0, 0, 0, .05)
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      background: radial-gradient(ellipse at 50% 40%, var(--glow), transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      position: relative
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: max(18px, env(safe-area-inset-top, 0px)) 20px 0;
      text-align: center;
      pointer-events: none
    }

    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: .04em;
      margin: 14px 0 2px
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .06em
    }

    .search {
      pointer-events: auto;
      margin: 16px auto 0;
      max-width: 340px;
      position: relative
    }

    .search input {
      width: 100%;
      padding: 11px 40px 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      outline: none;
      backdrop-filter: blur(6px)
    }

    .search input:focus {
      border-color: var(--accent)
    }

    .search button {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      display: none;
      padding: 4px 10px
    }

    .status {
      height: 18px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent);
      letter-spacing: .05em
    }

    #field {
      position: absolute;
      inset: 0;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)
    }

    .msg {
      position: absolute;
      left: 100%;
      min-width: min(500px, 70vw);
      cursor: pointer;
      animation: drift var(--dur) linear var(--delay) infinite;
      will-change: transform
    }

    .msg.once {
      animation-iteration-count: 1;
      animation-fill-mode: forwards
    }

    .msg .in {
      animation: bob var(--bob) ease-in-out infinite alternate;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid transparent;
      transition: opacity .4s, filter .4s, background .3s, border-color .3s
    }

    .msg p {
      margin: 0;
      font-family: var(--serif);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .msg small {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: .07em;
      color: var(--accent);
      text-transform: uppercase
    }

    .d0 .in {
      opacity: .38;
      filter: blur(1.2px)
    }

    .d0 p {
      font-size: 15px
    }

    .d1 .in {
      opacity: .68
    }

    .d1 p {
      font-size: 18px
    }

    .d2 .in {
      opacity: .95
    }

    .d2 p {
      font-size: 21px
    }

    .msg:hover .in,
    .msg.fresh .in {
      opacity: 1;
      filter: none;
      background: var(--field);
      border-color: var(--line)
    }

    .msg:hover,
    body.paused .msg {
      animation-play-state: paused
    }

    .msg.void .in {
      border-color: var(--line);
      border-style: dashed
    }

    .msg.fresh .in {
      border-color: var(--accent);
      box-shadow: 0 0 28px var(--glow)
    }

    body.searching .msg:not(.match) .in {
      opacity: .08;
      filter: blur(2px)
    }

    body.searching .msg.match .in {
      opacity: 1;
      filter: none;
      background: var(--field);
      border-color: var(--line)
    }

    @keyframes drift {
      to {
        transform: translateX(calc(-100vw - 110%))
      }
    }

    @keyframes bob {
      to {
        transform: translateY(var(--by))
      }
    }

    .fab {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(24px, env(safe-area-inset-bottom, 0px));
      z-index: 6;
      padding: 14px 26px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: var(--card);
      color: var(--text);
      font: 500 14px var(--sans);
      letter-spacing: .05em;
      cursor: pointer;
      box-shadow: 0 0 30px var(--glow);
      backdrop-filter: blur(8px)
    }

    .fab:hover {
      background: var(--accent);
      color: #14110a
    }

    .count {
      position: absolute;
      right: 18px;
      bottom: max(34px, env(safe-area-inset-bottom, 0px));
      font-size: 12px;
      color: var(--muted);
      z-index: 5
    }

    .hint {
      position: absolute;
      left: 18px;
      bottom: max(34px, env(safe-area-inset-bottom, 0px));
      font-size: 12px;
      color: var(--muted);
      z-index: 5
    }

    @media(max-width:640px) {

      .count,
      .hint {
        display: none
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(5, 7, 14, .62);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .overlay.open {
      display: flex
    }

    .panel {
      width: 100%;
      max-width: 480px;
      max-height: 92vh;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px;
      position: relative
    }

    .panel h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 28px;
      margin: 0 0 4px
    }

    .panel .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 18px
    }

    .x {
      position: absolute;
      right: 12px;
      top: 10px;
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 26px;
      cursor: pointer
    }

    label.l {
      display: block;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 6px
    }

    .panel input[type=text],
    .panel textarea {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      outline: none
    }

    .panel textarea {
      min-height: 120px;
      resize: vertical;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.35
    }

    .panel input:focus,
    .panel textarea:focus {
      border-color: var(--accent)
    }

    .row {
      display: flex;
      gap: 10px
    }

    .row>div {
      flex: 1
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      cursor: pointer
    }

    .chk input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px
    }

    .seg label {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.35
    }

    .seg label b {
      display: block;
      font-size: 14px;
      margin-bottom: 2px
    }

    .seg span {
      color: var(--muted);
      font-size: 12px
    }

    .seg input {
      position: absolute;
      opacity: 0
    }

    .seg label:has(input:checked) {
      border-color: var(--accent);
      background: var(--field)
    }

    .go {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: #14110a;
      font: 500 14px var(--sans);
      letter-spacing: .05em;
      cursor: pointer
    }

    .go:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .big {
      font-family: var(--serif);
      font-size: 24px;
      line-height: 1.4;
      margin: 14px 0 18px
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7
    }

    .meta b {
      color: var(--accent);
      font-weight: 500
    }

    .link {
      background: none;
      border: 0;
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      margin-top: 12px;
      text-decoration: underline
    }

    .toast {
      position: fixed;
      left: 50%;
      top: max(20px, env(safe-area-inset-top, 0px));
      transform: translate(-50%, -80px);
      z-index: 30;
      background: var(--card);
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      transition: transform .5s
    }

    .toast.show {
      transform: translate(-50%, 0)
    }

    @media(prefers-reduced-motion:reduce) {

      .msg,
      .msg .in {
        animation-duration: 400s !important
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Remembered</h1>
    <p>Small thoughts for the ones we miss</p>
    <div class="search">
      <input id="q" type="text" list="names" placeholder="Search by the name of who is remembered" autocomplete="off"
        aria-label="Search by name">
      <button id="clr" aria-label="Clear search">&times;</button>
      <datalist id="names"></datalist>
    </div>
    <div class="status" id="status"></div>
  </header>

  <div id="field"></div>

  <div class="hint">Hover to pause · click to read</div>
  <button class="fab" id="open">Leave a memory</button>
  <div class="count" id="count"></div>

  <div class="overlay" id="view">
    <div class="panel">
      <button class="x" data-close aria-label="Close">&times;</button>
      <div class="meta">In memory of <b id="vFor"></b></div>
      <div class="big" id="vText"></div>
      <div class="meta" id="vBy"></div>
      <button class="link" id="vMore"></button>
    </div>
  </div>

  <div class="overlay" id="form">
    <div class="panel">
      <button class="x" data-close aria-label="Close">&times;</button>
      <h2>Leave a memory</h2>
      <p class="sub">A moment, a habit, a laugh, something you never got to say.</p>
      <label class="l" for="fText">Your memory</label>
      <textarea id="fText" maxlength="400" placeholder="She always hummed while she cooked&hellip;"></textarea>
      <div class="row">
        <div><label class="l" for="fFor">Who are you remembering?</label><input type="text" id="fFor"
            placeholder="Name"></div>
        <div><label class="l" for="fBy">Your name</label><input type="text" id="fBy" placeholder="Name"></div>
      </div>
      <label class="chk"><input type="checkbox" id="anonFor"> Keep their name private (shown as "someone dearly
        missed")</label>
      <label class="chk"><input type="checkbox" id="anonBy"> Send anonymously (hide my name)</label>
      <label class="l">Where should it go?</label>
      <div class="seg">
        <label><input type="radio" name="dest" value="server" checked><b>Keep it here</b><span>Saved to the server. It
            drifts with the others, and can be found by search.</span></label>
        <label><input type="radio" name="dest" value="void"><b>Into the void</b><span>Drifts past once, then is gone.
            Nothing is saved.</span></label>
      </div>
      <button class="go" id="send" disabled>Release it</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Prototype data lives in memory only. A real build replaces SEED/addMessage with API calls.
    const SEED = [
      {t: "She hummed while she cooked, always the same three notes. I hum them now when I make coffee.", f: "Margareta Lindqvist", b: "Anna"},
      {t: "You taught me to drive in a snowstorm and never once raised your voice.", f: "Farfar Olle", b: "Teo"},
      {t: "Thank you for the Sunday walks. I did not know they were the best part of the week.", f: "Margareta Lindqvist", b: "Johan"},
      {t: "He left the porch light on for everyone, even people he had never met.", f: "Sami", b: null},
      {t: "We never finished the puzzle. It is still on the table.", f: null, b: "Ingrid"},
      {t: "Eli, the dog still waits at the gate around five.", f: "Eli", b: "Mum"},
      {t: "You made every room feel like it had been waiting for you to arrive.", f: "Farfar Olle", b: null},
      {t: "I can still hear your laugh in the stairwell. It never got old.", f: "Sami", b: "Maja"},
      {t: "She kept every postcard I ever sent. All of them, in a shoebox.", f: "Ingrid", b: "Lena"},
      {t: "Your terrible jokes live on. I told one at the funeral and everybody groaned, exactly right.", f: "Eli", b: "Noor"},
      {t: "We were only friends for one summer. It was enough to change me.", f: null, b: null},
      {t: "You always said the sea was the only honest thing. I went today. You were right.", f: "Tobias Ek", b: "Elin"},
      {t: "I wish I had called one more time.", f: "Ingrid", b: null},
      {t: "Thank you for believing in me before I did.", f: "Tobias Ek", b: "A former student"}
    ];
    const field = document.getElementById('field'), q = document.getElementById('q');
    const state = [], dups = [];
    const statusEl = document.getElementById('status'), openBtn = document.getElementById('open');
    const rnd = (a, b) => a + Math.random() * (b - a);

    function label(m) {return m.f && !m.anonF ? m.f : "someone dearly missed"}
    function byline(m) {return m.b && !m.anonB ? m.b : "someone who loved them"}

    function spawn(m, opts = {}) {
      const d = Math.random() < .3 ? 0 : Math.random() < .55 ? 1 : 2;
      const dur = [150, 105, 75][d] * rnd(.85, 1.2);
      const el = document.createElement('div');
      el.className = 'msg d' + d + (opts.once ? ' once void' : '') + (opts.fresh ? ' fresh' : '');
      el.style.top = rnd(18, 84) + '%';
      el.style.setProperty('--dur', dur + 's');
      el.style.setProperty('--bob', rnd(5, 9) + 's');
      el.style.setProperty('--by', rnd(-14, 14) + 'px');
      el.style.setProperty('--delay', opts.once ? '0s' : '-' + rnd(0, dur) + 's');
      const inner = document.createElement('div'); inner.className = 'in';
      const p = document.createElement('p'); p.textContent = m.t;
      const s = document.createElement('small'); s.textContent = 'for ' + label(m);
      inner.append(p, s); el.append(inner);
      el.onclick = () => show(m);
      if (opts.once) el.addEventListener('animationend', e => {if (e.animationName === 'drift') {el.remove(); count()} });
      field.append(el);
      m.el = el;
      if (opts.fresh) setTimeout(() => el.classList.remove('fresh'), 9000);
      return el;
    }
    function count() {document.getElementById('count').textContent = state.length + ' memories kept'}

    function show(m) {
      document.body.classList.add('paused');
      vFor.textContent = label(m); vText.textContent = '\u201C' + m.t + '\u201D';
      vBy.textContent = 'Left by ' + byline(m);
      const known = m.f && !m.anonF;
      vMore.style.display = known ? 'inline' : 'none';
      vMore.textContent = 'More memories of ' + m.f;
      vMore.onclick = () => {closeAll(); q.value = m.f; search()};
      view.classList.add('open');
    }
    function closeAll() {document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); document.body.classList.remove('paused')}

    function search() {
      const v = q.value.trim().toLowerCase();
      clr.style.display = v ? 'block' : 'none';
      document.body.classList.toggle('searching', !!v);
      let n = 0;
      state.forEach(m => {const hit = !!v && m.f && !m.anonF && m.f.toLowerCase().includes(v); m.el.classList.toggle('match', hit); if (hit) n++});
      dups.forEach(m => m.el.classList.toggle('match', !!v && m.f && !m.anonF && m.f.toLowerCase().includes(v)));
      statusEl.textContent = v ? (n ? n + (n > 1 ? ' memories' : ' memory') + ' found' : 'No memories found yet. Be the first to leave one.') : '';
      document.body.classList.toggle('paused', false);
    }
    function refreshNames() {
      const set = [...new Set(state.filter(m => m.f && !m.anonF).map(m => m.f))].sort();
      names.innerHTML = ''; set.forEach(n => {const o = document.createElement('option'); o.value = n; names.append(o)});
    }
    q.addEventListener('input', search);
    clr.onclick = () => {q.value = ''; search(); q.focus()};

    function toast(msg) {toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 3600)}
    const toastEl = document.getElementById('toast');

    // form
    openBtn.onclick = () => {document.body.classList.add('paused'); form.classList.add('open'); fText.focus()};
    function valid() {send.disabled = !(fText.value.trim() && (fFor.value.trim() || anonFor.checked))}
    [fText, fFor, anonFor].forEach(e => e.addEventListener('input', valid));
    anonFor.addEventListener('change', () => {fFor.disabled = false});
    send.onclick = () => {
      const dest = document.querySelector('input[name=dest]:checked').value;
      const m = {t: fText.value.trim(), f: fFor.value.trim() || null, b: fBy.value.trim() || null, anonF: anonFor.checked, anonB: anonBy.checked};
      closeAll();
      if (dest === 'server') {
        state.push(m); spawn(m, {fresh: true});
        // Make it enter near the right edge soon: shift its start so it is visible shortly
        m.el.style.setProperty('--delay', '-' + (parseFloat(m.el.style.getPropertyValue('--dur')) * .12) + 's');
        count(); refreshNames(); toast('Your memory is now part of the cloud');
      } else {
        spawn(m, {once: true, fresh: true});
        toast('Released into the void. It will not be kept');
      }
      fText.value = fFor.value = fBy.value = ''; anonFor.checked = anonBy.checked = false; valid(); search();
    };
    document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeAll);
    document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => {if (e.target === o) closeAll()}));
    document.addEventListener('keydown', e => {if (e.key === 'Escape') closeAll()});

    SEED.forEach(m => {state.push(m); spawn(m)});
    // duplicate a few so the field feels fuller
    SEED.slice(0, 8).forEach(s => {const m = {...s}; spawn(m); dups.push(m)});
    count(); refreshNames();
  </script>
</body>

</html>
