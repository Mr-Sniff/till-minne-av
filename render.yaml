services:
  - type: web
    name: till-minne-av
    runtime: ruby
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bundle install
    startCommand: bundle exec ruby app.rb
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/memorial.db
      - key: SEED_DEMO
        value: "true"
    # För beständig lagring: uppgradera till betald instans och ta bort
    # kommentarerna nedan. Disken monteras på samma katalog som
    # DATABASE_PATH pekar på, så databasen överlever deploys.
    # plan: 0.5c-512mb
    # disk:
    #   name: memorial-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
